---
{{- if eq .Values.database.source "zalando-postgres" -}}
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: {{ include "roundcube.fullname" . }}-db
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  teamId: "{{ include "roundcube.fullname" . }}"
  volume:
    size: "{{ .Values.database.volumeSize }}"
    storageClass: "{{ .Values.database.storageClassName }}"
  numberOfInstances: {{ .Values.database.instances }}
  preparedDatabases:
    roundcube:
      defaultUsers: true
  postgresql:
    version: "15"
{{- end -}}
