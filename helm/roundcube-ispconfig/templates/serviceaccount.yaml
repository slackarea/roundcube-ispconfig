{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "roundcube.serviceAccountName" . }}
  annotations:
    {{- if .Values.serviceAccount.additionalAnnotations }}
    {{- include "roundcube.tplvalues.render" ( dict "value" .Values.serviceAccount.additionalAnnotations "context" $) | nindent 4 }}
    {{- end }}
  labels:
    {{- include "roundcube.labels.standard" . | nindent 4 }}
    {{- if .Values.serviceAccount.additionalLabels }}
    {{- include "roundcube.tplvalues.render" ( dict "value"
    .Values.serviceAccount.additionalLabels "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
