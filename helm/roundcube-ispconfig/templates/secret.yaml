---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roundcube.fullname" . }}
  labels:
    {{- include "roundcube.labels.standard" . | nindent 4 }}
    {{- if .Values.secret.additionalLabels }}
    {{- include "roundcube.tplvalues.render" ( dict "value" .Values.secret.additionalLabels "context" $) | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.secret.additionalAnnotations }}
    {{- include "roundcube.tplvalues.render" ( dict "value" .Values.secret.additionalAnnotations "context" $) | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  smtpUsername: "{{ .Values.smtp.username }}"
  smtpPassword: "{{ .Values.smtp.password }}"
  dbUsername: "{{ .Values.externalDatabase.user }}"
  dbPassword: "{{ .Values.externalDatabase.password }}"
  desKey: "{{ include "roundcube.desKey" . }}"
