---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "roundcube.fullname" . }}
  labels:
    {{- include "roundcube.labels.standard" . | nindent 4 }}
    {{- if .Values.service.additionalLabels }}
    {{- include "roundcube.tplvalues.render" ( dict "value" .Values.service.additionalLabels "context" $) | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.service.additionalAnnotations }}
    {{- include "roundcube.tplvalues.render" ( dict "value" .Values.service.additionalAnnotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  selector:
    {{- include "roundcube.labels.matchLabels" . | nindent 4 }}
  ipFamilyPolicy: {{ .Values.service.ipFamilyPolicy }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.deployment.port }}
